<div class="bg-[#620f14] border border-[#a4202e]/40 rounded-2xl p-6 shadow-xl space-y-6 text-[#fefae2] w-full max-w-7xl mx-auto">
    <!-- Cabecera simétrica con pestañas de control -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-[#a4202e]/40 pb-4">
        <div>
            <h2 class="text-xl font-bold text-[#e7b263] uppercase tracking-wide">Logística y Despachos - Service Euros</h2>
            <p class="text-xs text-[#e7b263]/70">Gestión de fletes, destinos programados y tarifas por zona</p>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <button onclick="cambiarVistaLogistica('despachos')" id="btn-tab-despachos" class="flex-1 sm:flex-none px-4 py-2 text-xs font-bold rounded-xl bg-[#e7b263] text-[#620f14] shadow transition">
                Eventos & Despachos
            </button>
            <button onclick="cambiarVistaLogistica('tarifas')" id="btn-tab-tarifas" class="flex-1 sm:flex-none px-4 py-2 text-xs font-bold rounded-xl bg-neutral-900/80 text-[#e7b263] border border-[#e7b263]/30 hover:bg-neutral-800 transition">
                Zonas & Tarifas Flete
            </button>
            <button onclick="abrirModalTarifa()" class="px-4 py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 transition flex items-center justify-center gap-1 shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                Nueva Zona
            </button>
        </div>
    </div>

    <!-- SECCIÓN 1: EVENTOS APROBADOS Y DESTINOS DE DESPACHO -->
    <div id="seccion-despachos" class="space-y-4">
        <div id="logistica-contenido" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dinámico por JS -->
        </div>
    </div>

    <!-- SECCIÓN 2: ADMINISTRACIÓN DE TARIFAS DE TRANSPORTE Y ZONAS -->
    <div id="seccion-tarifas" class="space-y-4 hidden">
        <div class="overflow-x-auto rounded-xl border border-[#a4202e]/30 bg-black/10">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-[#a4202e]/40 text-xs text-[#e7b263] uppercase bg-[#620f14]/80">
                        <th class="p-3.5 w-16 text-center">ID</th>
                        <th class="p-3.5 w-1/3">Departamento / Zona</th>
                        <th class="p-3.5 w-32 text-right">Costo Base Flete</th>
                        <th class="p-3.5">Condiciones / Descripción</th>
                        <th class="p-3.5 w-32 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-tarifas-contenido" class="divide-y divide-[#a4202e]/20 text-sm">
                    <!-- Dinámico por JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL PARA ASIGNAR / ACTUALIZAR FLETE A UN EVENTO APROBADO -->
<div id="modal-flete-evento" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-[#620f14] border border-[#e7b263]/40 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4 text-[#fefae2]">
        <div class="flex justify-between items-center border-b border-[#a4202e]/40 pb-3">
            <h3 class="text-lg font-bold text-[#e7b263]">Actualizar Costo de Flete</h3>
            <button onclick="cerrarModalFlete()" class="text-[#e7b263] hover:text-white font-bold text-xl">&times;</button>
        </div>
        <form id="form-flete" onsubmit="guardarFleteEvento(event)" class="space-y-4 text-xs">
            <input type="hidden" id="flete-cotizacion-id">
            <div>
                <label class="block font-semibold text-[#e7b263] mb-1">Destino Actual:</label>
                <p id="flete-txt-destino" class="text-sm font-bold text-white bg-neutral-900 p-2.5 rounded-lg border border-[#a4202e]/40"></p>
            </div>
            <div>
                <label class="block font-semibold text-[#e7b263] mb-1">Seleccionar Zona / Tarifa Predefinida:</label>
                <select id="flete-select-tarifa" onchange="seleccionarTarifaZona()" class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]">
                    <option value="">-- Seleccionar Zona --</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-[#e7b263] mb-1">Costo Flete Asignado (Bs.) *</label>
                <input type="number" step="0.01" id="flete-costo-input" required min="0" class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]">
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t border-[#a4202e]/40">
                <button type="button" onclick="cerrarModalFlete()" class="px-4 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-bold">Cancelar</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-[#e7b263] text-[#620f14] font-bold hover:bg-amber-400 shadow">Guardar Flete</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL PARA CREAR / EDITAR ZONAS Y TARIFAS DE TRANSPORTE -->
<div id="modal-tarifa" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-[#620f14] border border-[#e7b263]/40 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4 text-[#fefae2]">
        <div class="flex justify-between items-center border-b border-[#a4202e]/40 pb-3">
            <h3 id="modal-tarifa-titulo" class="text-lg font-bold text-[#e7b263]">Gestión de Zona y Flete</h3>
            <button onclick="cerrarModalTarifa()" class="text-[#e7b263] hover:text-white font-bold text-xl">&times;</button>
        </div>
        <form id="form-tarifa" onsubmit="guardarTarifaZona(event)" class="space-y-4 text-xs">
            <input type="hidden" id="tarifa-id">
            <div>
                <label class="block font-semibold text-[#e7b263] mb-1">Departamento o Zona *</label>
                <input type="text" id="tarifa-zona" required placeholder="Ej: Tiquipaya, Cercado, Quillacollo" class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]">
            </div>
            <div>
                <label class="block font-semibold text-[#e7b263] mb-1">Costo Base Flete (Bs.) *</label>
                <input type="number" step="0.01" id="tarifa-costo" required min="0" class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]">
            </div>
            <div>
                <label class="block font-semibold text-[#e7b263] mb-1">Descripción / Condiciones</label>
                <textarea id="tarifa-desc" rows="2" placeholder="Ej: Incluye transporte y peaje urbano" class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t border-[#a4202e]/40">
                <button type="button" onclick="cerrarModalTarifa()" class="px-4 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-bold">Cancelar</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-[#e7b263] text-[#620f14] font-bold hover:bg-amber-400 shadow">Guardar Zona</button>
            </div>
        </form>
    </div>
</div>
