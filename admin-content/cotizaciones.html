<div class="bg-[#620f14] border border-[#a4202e]/40 rounded-2xl p-6 shadow-xl space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-[#e7b263] uppercase tracking-wide">Solicitudes y Cotizaciones</h2>
        <span class="text-xs text-[#e7b263]/70 font-semibold">Tabla: cotizaciones_service_euros</span>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-[#a4202e]/40 text-xs text-[#e7b263] uppercase tracking-wider">
                    <th class="py-3 px-3">ID</th>
                    <th class="py-3 px-3">Cliente / Teléfono</th>
                    <th class="py-3 px-3">Tipo Evento</th>
                    <th class="py-3 px-3">Destino</th>
                    <th class="py-3 px-3">Fecha</th>
                    <th class="py-3 px-3">Precio Est. / Ajustado</th>
                    <th class="py-3 px-3">Estado</th>
                    <th class="py-3 px-3 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-cotizaciones-contenido" class="divide-y divide-[#a4202e]/20 text-sm">
                <!-- Se llena vía JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Detallado: Ficha de Llamada y Ajuste de Tarifa Preferencial -->
<div id="modal-precio" class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-[#240608] border border-[#a4202e] p-6 rounded-2xl w-full max-w-md shadow-2xl space-y-5">
        
        <!-- Input Oculto para almacenar el ID de la cotización actual -->
        <input type="hidden" id="modal-cot-id">

        <!-- Cabecera del Modal -->
        <div class="flex justify-between items-start border-b border-[#a4202e]/40 pb-3">
            <div>
                <h3 class="text-base font-bold text-[#e7b263] uppercase tracking-wide">Gestión de Solicitud</h3>
                <p class="text-xs text-[#fefae2]/60">Verificación y acuerdo por WhatsApp</p>
            </div>
            <button type="button" onclick="cerrarModalPrecio()" class="text-[#e7b263]/70 hover:text-white text-lg font-bold px-2 py-0.5 rounded transition cursor-pointer">&times;</button>
        </div>

        <!-- Tarjeta de Contacto de Alto Impacto Visual -->
        <div class="bg-gradient-to-br from-[#41080c] to-[#620f14] p-4 rounded-xl border border-[#a4202e]/60 shadow-inner space-y-3">
            <div class="flex items-center space-x-3">
                <div class="bg-[#e7b263]/20 p-2.5 rounded-lg text-[#e7b263]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-[#e7b263]/70 font-semibold block">Cliente Titular</span>
                    <span id="modal-cliente-nombre" class="text-sm font-bold text-white">-</span>
                </div>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-[#a4202e]/30">
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-[#e7b263]/70 font-semibold block">Teléfono de Contacto</span>
                    <span id="modal-cliente-telefono" class="text-base font-mono font-bold text-emerald-400 tracking-wide">-</span>
                </div>
                <!-- Botón adaptado para WhatsApp Web / Desktop / Mobile -->
                <a id="modal-btn-llamar" href="#" target="_blank" rel="noopener noreferrer" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow-md">
                    <span>💬 WhatsApp</span>
                </a>
            </div>
        </div>

        <!-- Campo para Ajustar Precio -->
        <div class="space-y-1.5">
            <label class="text-xs text-[#fefae2]/80 font-semibold block">Nuevo Monto Total Acordado (Bs.)</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-emerald-300 font-bold text-sm">Bs.</span>
                <input type="number" id="modal-nuevo-precio" step="0.01" class="w-full bg-[#620f14] border border-[#a4202e]/60 rounded-xl py-2.5 pl-10 pr-3 text-white font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-[#e7b263]/50">
            </div>
        </div>
        
        <!-- Botones de Acción Inferiores Simétricos -->
        <div class="flex space-x-3 pt-3 border-t border-[#a4202e]/40">
            <button type="button" onclick="cerrarModalPrecio()" class="flex-1 px-4 py-2.5 rounded-xl bg-neutral-700 hover:bg-neutral-600 text-white text-xs font-semibold transition cursor-pointer">Cancelar</button>
            <button type="button" onclick="guardarPrecioYAProbar()" class="flex-1 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition shadow-md cursor-pointer">Guardar y Aprobar</button>
        </div>
    </div>
</div>
