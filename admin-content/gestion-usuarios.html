<div class="bg-[#620f14] border border-[#a4202e]/40 rounded-2xl p-6 shadow-xl space-y-6 text-[#fefae2] w-full max-w-7xl mx-auto">
    <!-- Cabecera simétrica con título y botón de Acción -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-[#a4202e]/40 pb-4">
        <div>
            <h2 class="text-xl font-bold text-[#e7b263] uppercase tracking-wide">Gestión de Usuarios del Sistema</h2>
            <p class="text-xs text-[#e7b263]/70">Administración de accesos, roles y datos de clientes (Tabla: usuarios_service_euros)</p>
        </div>
        <button onclick="abrirModalUsuario()" class="px-4 py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 transition flex items-center justify-center gap-1 shadow">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            Nuevo Usuario
        </button>
    </div>

    <!-- Tabla Simétrica de Usuarios -->
    <div class="overflow-x-auto rounded-xl border border-[#a4202e]/30 bg-black/10">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-[#a4202e]/40 text-xs text-[#e7b263] uppercase bg-[#620f14]/80">
                    <th class="p-3.5 w-1/4">Nombre Completo</th>
                    <th class="p-3.5 w-1/4">Correo Electrónico</th>
                    <th class="p-3.5 w-32">Teléfono</th>
                    <th class="p-3.5 w-28 text-center">Rol</th>
                    <th class="p-3.5 w-36 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios-contenido" class="divide-y divide-[#a4202e]/20 text-sm">
                <!-- Se llena vía JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL PARA CREAR / EDITAR USUARIOS -->
<div id="modal-usuario" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-[#620f14] border border-[#e7b263]/40 rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-4 text-[#fefae2]">
        <div class="flex justify-between items-center border-b border-[#a4202e]/40 pb-3">
            <h3 id="modal-usuario-titulo" class="text-lg font-bold text-[#e7b263]">Gestión de Usuario</h3>
            <button onclick="cerrarModalUsuario()" class="text-[#e7b263] hover:text-white font-bold text-xl">&times;</button>
        </div>
        <form id="form-usuario" onsubmit="guardarUsuario(event)" class="space-y-4 text-xs">
            <input type="hidden" id="user-id">

            <div>
                <label class="block font-semibold text-[#e7b263] mb-1">Nombre Completo *</label>
                <input type="text" id="user-nombre" required placeholder="Ej: Juan Pérez" class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block font-semibold text-[#e7b263] mb-1">Correo Electrónico *</label>
                    <input type="email" id="user-correo" required placeholder="correo@ejemplo.com" class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]">
                </div>
                <div>
                    <label class="block font-semibold text-[#e7b263] mb-1">Teléfono / WhatsApp *</label>
                    <input type="text" id="user-telefono" required placeholder="Ej: 71234567" class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block font-semibold text-[#e7b263] mb-1">Rol del Sistema *</label>
                    <select id="user-rol" required class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]">
                        <option value="cliente">Cliente</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div id="campo-password-container">
                    <label class="block font-semibold text-[#e7b263] mb-1" id="lbl-password">Contraseña *</label>
                    <input type="password" id="user-password" placeholder="******" class="w-full p-2.5 rounded-lg bg-neutral-900 border border-[#a4202e]/50 text-white focus:outline-none focus:border-[#e7b263]">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-[#a4202e]/40">
                <button type="button" onclick="cerrarModalUsuario()" class="px-4 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-bold">Cancelar</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-[#e7b263] text-[#620f14] font-bold hover:bg-amber-400 shadow">Guardar Usuario</button>
            </div>
        </form>
    </div>
</div>
