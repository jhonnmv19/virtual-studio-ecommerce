<div class="bg-[#12192a] border border-[#00e4fb]/30 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6 text-[#eaecee] w-full max-w-7xl mx-auto">
    <!-- Cabecera simétrica con título y botón de Acción -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-[#00e4fb]/20 pb-4">
        <div>
            <h2 class="text-xl font-extrabold text-[#eaecee] uppercase tracking-wide">Gestión de Usuarios del Sistema</h2>
            <p class="text-xs text-[#eaecee]/60 mt-0.5">Administración de accesos, roles y datos de clientes (Tabla: usuarios_service_euros)</p>
        </div>
        <button onclick="abrirModalUsuario()" class="px-4 py-2.5 text-xs font-extrabold rounded-xl bg-[#00e4fb] text-[#12192a] hover:bg-[#cdf9fe] transition flex items-center justify-center gap-1.5 shadow-lg cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            Nuevo Usuario
        </button>
    </div>

    <!-- Tabla Simétrica de Usuarios -->
    <div class="overflow-x-auto rounded-xl border border-[#00e4fb]/20 bg-[#1b253d]/50">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-[#00e4fb]/30 text-xs text-[#00e4fb] uppercase bg-[#12192a]/80">
                    <th class="p-3.5 w-1/4">Nombre Completo</th>
                    <th class="p-3.5 w-1/4">Correo Electrónico</th>
                    <th class="p-3.5 w-32">Teléfono</th>
                    <th class="p-3.5 w-28 text-center">Rol</th>
                    <th class="p-3.5 w-36 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios-contenido" class="divide-y divide-[#00e4fb]/10 text-sm text-[#eaecee]/90">
                <!-- Se llena vía JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL PARA CREAR / EDITAR USUARIOS -->
<div id="modal-usuario" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-[#12192a] border border-[#00e4fb]/40 rounded-2xl w-full max-w-lg p-6 md:p-8 shadow-2xl space-y-4 text-[#eaecee]">
        <div class="flex justify-between items-center border-b border-[#00e4fb]/20 pb-3">
            <h3 id="modal-usuario-titulo" class="text-lg font-extrabold text-[#eaecee]">Gestión de Usuario</h3>
            <button onclick="cerrarModalUsuario()" class="text-[#eaecee]/60 hover:text-[#00e4fb] font-bold text-xl cursor-pointer">&times;</button>
        </div>
        <form id="form-usuario" onsubmit="guardarUsuario(event)" class="space-y-4 text-xs">
            <input type="hidden" id="user-id">

            <div>
                <label class="block font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Nombre Completo *</label>
                <input type="text" id="user-nombre" required placeholder="Ej: Juan Pérez" class="w-full p-3 rounded-xl bg-[#1b253d] border border-[#00e4fb]/40 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Correo Electrónico *</label>
                    <input type="email" id="user-correo" required placeholder="correo@ejemplo.com" class="w-full p-3 rounded-xl bg-[#1b253d] border border-[#00e4fb]/40 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm">
                </div>
                <div>
                    <label class="block font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Teléfono / WhatsApp *</label>
                    <input type="text" id="user-telefono" required placeholder="Ej: 71234567" class="w-full p-3 rounded-xl bg-[#1b253d] border border-[#00e4fb]/40 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Rol del Sistema *</label>
                    <select id="user-rol" required class="w-full p-3 rounded-xl bg-[#1b253d] border border-[#00e4fb]/40 text-[#eaecee] focus:outline-none focus:border-[#00e4fb] transition text-sm">
                        <option value="cliente">Cliente</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div id="campo-password-container">
                    <label class="block font-bold text-[#00e4fb] uppercase tracking-wider mb-1" id="lbl-password">Contraseña *</label>
                    <input type="password" id="user-password" placeholder="••••••••" class="w-full p-3 rounded-xl bg-[#1b253d] border border-[#00e4fb]/40 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-[#00e4fb]/20">
                <button type="button" onclick="cerrarModalUsuario()" class="px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs cursor-pointer transition">Cancelar</button>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#00e4fb] text-[#12192a] font-extrabold hover:bg-[#cdf9fe] shadow-md text-xs cursor-pointer transition">Guardar Usuario</button>
            </div>
        </form>
    </div>
</div>
