<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Solicitudes - Sonido Euros Bolivia</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Librerías de jsPDF necesarias para la factura -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-[#fefae2] text-[#2d080a] antialiased min-h-screen flex flex-col justify-between">

    <header class="sticky top-0 z-50 bg-[#1a0405] border-b border-[#a4202e]/30 shadow-xl text-[#fefae2]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="assets/img/logo Los euros_facturas.png" alt="Sonido Euros Logo" class="h-14 w-auto object-contain">
                <span class="text-xl font-extrabold tracking-wider hidden sm:inline">SONIDO <span class="text-[#a4202e]">EUROS</span></span>
            </a>
            <div id="auth-nav-container"></div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full">
        <h1 class="text-3xl font-black mb-2 text-[#2d080a]">Mis Solicitudes y Cotizaciones</h1>
        <p class="text-[#2d080a]/70 mb-8">Revisa el estado de aprobación de tus eventos programados en Sonido Euros.</p>

        <div id="solicitudes-container" class="space-y-4">
            <p class="text-center text-[#2d080a]/60 py-8">Cargando tus solicitudes...</p>
        </div>
    </main>

    <footer class="bg-[#1a0405] border-t border-[#a4202e]/30 py-12 px-4 text-sm text-[#fefae2]/60">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <p>&copy; 2026 Sonido Euros Bolivia. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts en el orden correcto -->
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/facturaGenerator.js"></script> <!-- Archivo que contiene la función generarFacturaPDF -->
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html?redirect=mis-solicitudes.html';
                return;
            }

            const container = document.getElementById('solicitudes-container');
            
            try {
                const { data, error } = await supabaseClient
                    .from('cotizaciones_service_euros')
                    .select('*')
                    .eq('usuario_id', user.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-[#2d080a]">No tienes solicitudes de cotización registradas todavía. <a href="cotizador.html" class="text-[#a4202e] font-bold underline">¡Crea una aquí!</a></div>`;
                    return;
                }

                container.innerHTML = data.map(cot => {
                    let badgeColor = 'bg-yellow-500/20 text-yellow-700 border-yellow-500';
                    let estadoTexto = 'En Revisión por Administración';
                    
                    if (cot.estado === 'aprobado') {
                        badgeColor = 'bg-green-500/20 text-green-700 border-green-500';
                        estadoTexto = '¡Aprobado con Éxito!';
                    } else if (cot.estado === 'rechazado') {
                        badgeColor = 'bg-red-500/20 text-red-700 border-red-500';
                        estadoTexto = 'Solicitud Rechazada';
                    }

                    return `
                        <div class="bg-white border border-[#a4202e]/20 rounded-2xl p-6 shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <span class="inline-block px-3 py-1 rounded-full text-xs font-bold border ${badgeColor} mb-2">${estadoTexto}</span>
                                <h3 class="text-xl font-extrabold text-[#2d080a]">${cot.tipo_evento} - ${cot.departamento}</h3>
                                <p class="text-xs text-gray-500 mt-1">Fecha del evento: <strong>${cot.fecha_evento}</strong> a las ${cot.hora_inicio}</p>
                                <p class="text-xs text-gray-500">Dirección: ${cot.direccion_exacta || 'No especificada'}</p>
                                ${cot.motivo_rechazo ? `<p class="text-xs text-red-600 mt-2 bg-red-50 p-2 rounded"><strong>Motivo:</strong> ${cot.motivo_rechazo}</p>` : ''}
                            </div>
                            <div class="text-right w-full md:w-auto flex flex-col items-end gap-2">
                                <span class="text-lg font-black text-[#a4202e]">Bs. ${parseFloat(cot.precio_estimado_total).toFixed(2)}</span>
                                ${cot.estado === 'aprobado' ? `<button onclick="generarFacturaPDF(${cot.id})" class="bg-[#a4202e] hover:bg-[#861924] text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1 cursor-pointer"><i data-lucide="file-down" class="w-4 h-4"></i><span>Descargar Factura</span></button>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                lucide.createIcons();
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-red-600 text-center">Error al cargar las solicitudes.</p>`;
            }
        });
    </script>
</body>
</html>
