<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro - Sonido Euros Bolivia</title>
    <link rel="icon" type="image/png" href="assets/img/logo_visual.png">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#fefae2] text-[#2d080a] antialiased flex flex-col min-h-screen justify-between">

    <!-- Header Minimalista -->
    <header class="sticky top-0 z-50 bg-[#1a0405] border-b border-[#a4202e]/30 shadow-xl text-[#fefae2]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="assets/img/logo_visual.png" alt="Sonido Euros Logo" class="h-14 w-auto object-contain">
                <span class="text-xl font-extrabold tracking-wider hidden sm:inline">SONIDO <span class="text-[#a4202e]">EUROS</span></span>
            </a>
            <a href="index.html" class="text-xs text-[#e7b263] hover:underline flex items-center space-x-1 font-semibold">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Volver al inicio</span>
            </a>
        </div>
    </header>

    <!-- Contenido Login / Registro -->
    <main class="max-w-md w-full mx-auto px-4 py-12 flex-grow flex items-center">
        <div class="w-full bg-[#620f14] border border-[#a4202e]/50 rounded-2xl p-8 shadow-2xl text-[#fefae2]">
            
            <div class="text-center mb-6">
                <h1 class="text-2xl font-black text-[#fefae2]">Portal de Acceso</h1>
                <p class="text-xs text-[#fefae2]/70 mt-1">Gestiona tus cotizaciones y eventos con Sonido Euros</p>
            </div>

            <!-- Contenedor de Notificaciones (Reemplaza los alert) -->
            <div id="auth-message" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold text-center"></div>

            <!-- Pestañas de Navegación Login / Registro -->
            <div class="flex border-b border-[#a4202e]/50 mb-6 pb-2">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 text-center font-bold pb-2 text-[#e7b263] border-b-2 border-[#e7b263] transition">Iniciar Sesión</button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 text-center font-bold pb-2 text-[#fefae2]/60 hover:text-[#fefae2] transition">Registrarse</button>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" class="w-full bg-[#2d080a] border border-[#a4202e] rounded-lg p-3 text-[#fefae2] focus:outline-none focus:border-[#e7b263]" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Contraseña</label>
                    <input type="password" id="login-password" class="w-full bg-[#2d080a] border border-[#a4202e] rounded-lg p-3 text-[#fefae2] focus:outline-none focus:border-[#e7b263]" required>
                </div>
                <button type="submit" class="w-full bg-[#a4202e] hover:bg-[#861924] text-[#fefae2] py-3 rounded-xl font-bold text-sm shadow-lg transition cursor-pointer">
                    Ingresar al Sistema
                </button>
            </form>

            <!-- Formulario de Registro -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-semibold mb-1">Nombre Completo</label>
                    <input type="text" id="reg-nombre" class="w-full bg-[#2d080a] border border-[#a4202e] rounded-lg p-3 text-[#fefae2] focus:outline-none focus:border-[#e7b263]" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Teléfono</label>
                    <input type="tel" id="reg-telefono" class="w-full bg-[#2d080a] border border-[#a4202e] rounded-lg p-3 text-[#fefae2] focus:outline-none focus:border-[#e7b263]" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="w-full bg-[#2d080a] border border-[#a4202e] rounded-lg p-3 text-[#fefae2] focus:outline-none focus:border-[#e7b263]" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Contraseña</label>
                    <input type="password" id="reg-password" class="w-full bg-[#2d080a] border border-[#a4202e] rounded-lg p-3 text-[#fefae2] focus:outline-none focus:border-[#e7b263]" required>
                </div>
                <button type="submit" class="w-full bg-[#e7b263] hover:bg-[#d49f50] text-[#2d080a] py-3 rounded-xl font-bold text-sm shadow-lg transition cursor-pointer">
                    Crear Cuenta Nueva
                </button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#1a0405] border-t border-[#a4202e]/30 py-12 px-4 text-sm text-[#fefae2]/60">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <p class="font-bold text-[#fefae2]">SONIDO EUROS BOLIVIA</p>
                <p class="mt-1">Servicios Profesionales de Sonido, Iluminación y Producción de Eventos.</p>
            </div>
            <p>&copy; 2026 Sonido Euros Bolivia. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts Separados -->
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
