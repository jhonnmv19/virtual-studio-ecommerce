<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro - Virtual Studio Bolivia</title>
    <!-- Favicon con el logotipo corporativo -->
    <link rel="icon" type="image/png" href="assets/img/logo_visual.png">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#c9f3fd] text-[#12192a] antialiased flex flex-col min-h-screen justify-between selection:bg-[#00e4fb] selection:text-[#12192a]">

    <!-- Header Minimalista y Responsive -->
    <header class="sticky top-0 z-50 bg-[#12192a] text-[#eaecee] border-b border-[#00e4fb]/30 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
            
            <!-- Logotipo Virtual Studio -->
            <a href="index.html" class="flex items-center space-x-3 group">
                <img src="assets/img/logo_visual.png" alt="Virtual Studio Logo" class="h-12 w-auto object-contain transition-transform group-hover:scale-105">
                <span class="text-xl font-extrabold tracking-wider">VIRTUAL<span class="text-[#00e4fb]">STUDIO</span></span>
            </a>

            <!-- Enlace Volver -->
            <a href="index.html" class="text-xs text-[#00e4fb] hover:text-[#cdf9fe] hover:underline flex items-center space-x-1 font-semibold transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Volver al inicio</span>
            </a>
        </div>
    </header>

    <!-- Contenido Login / Registro -->
    <main class="max-w-md w-full mx-auto px-4 py-8 md:py-12 flex-grow flex items-center">
        <div class="w-full bg-[#12192a] border border-[#00e4fb]/30 rounded-2xl p-6 md:p-8 shadow-2xl text-[#eaecee]">
            
            <div class="text-center mb-6">
                <h1 class="text-2xl md:text-3xl font-black text-[#eaecee] tracking-tight">Portal de Acceso</h1>
                <p class="text-xs md:text-sm text-[#eaecee]/70 mt-1">Gestiona tus cotizaciones y proyectos con Virtual Studio</p>
            </div>

            <!-- Contenedor de Notificaciones -->
            <div id="auth-message" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold text-center border"></div>

            <!-- Pestañas de Navegación Login / Registro -->
            <div class="flex border-b border-[#00e4fb]/20 mb-6 pb-2">
                <button type="button" onclick="switchTab('login')" id="tab-login" class="flex-1 text-center font-bold pb-2 text-[#00e4fb] border-b-2 border-[#00e4fb] transition cursor-pointer">
                    Iniciar Sesión
                </button>
                <button type="button" onclick="switchTab('register')" id="tab-register" class="flex-1 text-center font-bold pb-2 text-[#eaecee]/60 hover:text-[#eaecee] transition cursor-pointer">
                    Registrarse
                </button>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form id="form-login" onsubmit="if(typeof handleLogin === 'function') { handleLogin(event); } else { event.preventDefault(); }" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="correo@ejemplo.com" class="w-full bg-[#1b253d] border border-[#00e4fb]/40 rounded-xl p-3 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-[#1b253d] border border-[#00e4fb]/40 rounded-xl p-3 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm" required>
                </div>
                <button type="submit" class="w-full bg-[#00e4fb] hover:bg-[#cdf9fe] text-[#12192a] py-3 rounded-xl font-extrabold text-sm shadow-lg transition cursor-pointer mt-2 flex items-center justify-center space-x-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Ingresar al Sistema</span>
                </button>
            </form>

            <!-- Formulario de Registro -->
            <form id="form-register" onsubmit="if(typeof handleRegister === 'function') { handleRegister(event); } else { event.preventDefault(); }" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Nombre Completo</label>
                    <input type="text" id="reg-nombre" placeholder="Juan Pérez" class="w-full bg-[#1b253d] border border-[#00e4fb]/40 rounded-xl p-3 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Teléfono</label>
                    <input type="tel" id="reg-telefono" placeholder="70000000" class="w-full bg-[#1b253d] border border-[#00e4fb]/40 rounded-xl p-3 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="reg-email" placeholder="correo@ejemplo.com" class="w-full bg-[#1b253d] border border-[#00e4fb]/40 rounded-xl p-3 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#00e4fb] uppercase tracking-wider mb-1">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="••••••••" class="w-full bg-[#1b253d] border border-[#00e4fb]/40 rounded-xl p-3 text-[#eaecee] placeholder-[#eaecee]/40 focus:outline-none focus:border-[#00e4fb] transition text-sm" required>
                </div>
                <button type="submit" class="w-full bg-[#00e4fb] hover:bg-[#cdf9fe] text-[#12192a] py-3 rounded-xl font-extrabold text-sm shadow-lg transition cursor-pointer mt-2 flex items-center justify-center space-x-2">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span>Crear Cuenta Nueva</span>
                </button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#12192a] text-[#eaecee]/70 border-t border-[#00e4fb]/30 py-8 px-4 text-sm mt-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div>
                <p class="font-bold text-[#eaecee]">VIRTUAL STUDIO BOLIVIA</p>
                <p class="text-xs text-[#eaecee]/60 mt-1">Producción Audiovisual, Sonido e Iluminación Profesional.</p>
            </div>
            <p class="text-xs">&copy; 2026 Virtual Studio Bolivia. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts Separados -->
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Función para alternar entre las pestañas de Login y Registro
        function switchTab(tab) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const msgBox = document.getElementById('auth-message');

            if (msgBox) msgBox.classList.add('hidden');

            if (tab === 'login') {
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
                
                tabLogin.classList.add('text-[#00e4fb]', 'border-b-2', 'border-[#00e4fb]');
                tabLogin.classList.remove('text-[#eaecee]/60');
                
                tabRegister.classList.remove('text-[#00e4fb]', 'border-b-2', 'border-[#00e4fb]');
                tabRegister.classList.add('text-[#eaecee]/60');
            } else {
                formRegister.classList.remove('hidden');
                formLogin.classList.add('hidden');
                
                tabRegister.classList.add('text-[#00e4fb]', 'border-b-2', 'border-[#00e4fb]');
                tabRegister.classList.remove('text-[#eaecee]/60');
                
                tabLogin.classList.remove('text-[#00e4fb]', 'border-b-2', 'border-[#00e4fb]');
                tabLogin.classList.add('text-[#eaecee]/60');
            }
        }

        lucide.createIcons();
    </script>
</body>
</html>
