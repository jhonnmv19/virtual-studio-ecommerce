<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Sonido Euros</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#2d080a] text-[#fefae2] antialiased flex h-screen overflow-hidden">

    <!-- Sidebar de Navegación -->
    <aside class="w-64 bg-[#240608] border-r border-[#a4202e]/30 flex flex-col justify-between hidden md:flex">
        <div>
            <!-- Logo / Título -->
            <div class="h-20 flex items-center px-6 space-x-3 border-b border-[#a4202e]/30">
                <i data-lucide="settings" class="text-[#a4202e] w-7 h-7"></i>
                <span class="text-xl font-extrabold tracking-wider">PANEL ADMIN</span>
            </div>

            <!-- Menú con redirección a secciones -->
            <nav class="p-4 space-y-2">
                <button onclick="cargarVista('dashboard')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-[#a4202e] text-[#fefae2] font-semibold transition nav-btn" data-target="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="cargarVista('cotizaciones')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-[#e7b263] hover:bg-[#620f14]/50 transition nav-btn" data-target="cotizaciones">
                    <i data-lucide="calendar-days" class="w-5 h-5"></i>
                    <span>Cotizaciones</span>
                </button>
                <button onclick="cargarVista('inventario')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-[#e7b263] hover:bg-[#620f14]/50 transition nav-btn" data-target="inventario">
                    <i data-lucide="box" class="w-5 h-5"></i>
                    <span>Inventario</span>
                </button>
                <button onclick="cargarVista('logistica')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-[#e7b263] hover:bg-[#620f14]/50 transition nav-btn" data-target="logistica">
                    <i data-lucide="truck" class="w-5 h-5"></i>
                    <span>Logística</span>
                </button>
                <button onclick="cargarVista('usuarios')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-[#e7b263] hover:bg-[#620f14]/50 transition nav-btn" data-target="usuarios">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span>Gestión Usuarios</span>
                </button>
            </nav>
        </div>

        <!-- Perfil del Admin -->
        <div class="p-4 border-t border-[#a4202e]/30">
            <div class="bg-[#620f14]/60 border border-[#a4202e]/40 p-3 rounded-xl flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-[#a4202e] flex items-center justify-center font-bold text-lg">AE</div>
                <div>
                    <h4 class="text-sm font-bold">ADMIN EUROS</h4>
                    <p class="text-xs text-[#e7b263]">Gerente General</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Contenido Principal Dinámico -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto">
        <!-- Header Superior -->
        <header class="bg-[#240608] border-b border-[#a4202e]/30 h-20 px-8 flex justify-between items-center shrink-0">
            <div class="flex items-center space-x-4">
                <h1 id="header-title" class="text-xl font-extrabold tracking-wide uppercase text-[#fefae2]">Control Operativo</h1>
            </div>
            <div class="flex items-center space-x-6">
                <!-- Alerta de Notificaciones en Tiempo Real -->
                <div id="alert-indicator" class="relative hidden">
                    <button class="bg-[#620f14] border border-[#a4202e]/40 p-2 rounded-full text-[#e7b263] hover:text-white transition relative">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span id="badge-notif" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                    </button>
                </div>

                <div class="flex items-center space-x-2 bg-[#620f14]/50 border border-[#a4202e]/40 px-3 py-1.5 rounded-full text-xs font-semibold">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-emerald-400 uppercase tracking-wider">Sistema Activo</span>
                </div>
                <button onclick="logoutUser()" class="border border-[#a4202e] text-[#fefae2] px-4 py-2 rounded-lg text-sm font-semibold hover:bg-[#a4202e] transition flex items-center space-x-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </header>

        <!-- Contenedor Dinámico donde se inyectan las vistas de admin-content/ o el Dashboard -->
        <main id="admin-main-container" class="p-8 max-w-7xl mx-auto w-full space-y-8 flex-1">
            <!-- Carga inicial por defecto (Dashboard con métricas y solicitudes recientes) -->
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-cotizaciones.js"></script>
    <script src="js/admin-inventario.js"></script>
    <script src="js/admin-logistica.js"></script>
    <script src="js/admin-usuarios.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarVista('dashboard');
            iniciarEscuchaTiempoReal(); // Alertas en tiempo real y actualización instantánea
        });
    </script>
</body>
</html>
